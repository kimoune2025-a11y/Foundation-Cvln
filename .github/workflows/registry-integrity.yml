name: Registry integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check canonical registry integrity
        run: node scripts/registry-integrity.mjs
